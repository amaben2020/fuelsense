<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FuelSense">
  <!-- Orbit Node: a tracked asset (the solid centre) with a satellite pass
       around it. The one filled shape against an otherwise all-stroke mark
       is the "live" accent — everything else here is geometry, this alone
       is a signal. Transparent ground so it sits on any surface. -->
  <g fill="none" stroke="#cde04a" stroke-width="5">
    <ellipse cx="32" cy="32" rx="22" ry="10" transform="rotate(-24 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="6" fill="#cde04a"/>
  <circle cx="49" cy="18" r="4" fill="#cde04a"/>
</svg>
