services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fuelguard
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d fuelguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_practice:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: practice_user
      POSTGRES_PASSWORD: practice_pass
      POSTGRES_DB: practice
    ports:
      - "5435:5432"
    volumes:
      - postgres_practice:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
    ports:
      - "5001:5001"
      - "5027:5027"
    environment:
      PORT: 5001
      TCP_PORT: 5027
      NODE_ENV: development
    # DATABASE_URL deliberately lives only here. Compose's `environment:` block
    # outranks `env_file:`, so setting it above silently pinned the container to
    # the local `db` service while .env pointed at Neon — the dashboard then
    # showed the seeded demo fleet instead of the real vehicle.
    env_file:
      - ./backend/.env

volumes:
  postgres_data:
  postgres_practice:
