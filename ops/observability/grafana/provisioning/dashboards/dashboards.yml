apiVersion: 1

providers:
  - name: FuelSense
    orgId: 1
    folder: FuelSense
    type: file
    disableDeletion: false
    # Edits made in the browser are overwritten on the next reload. Change the
    # JSON in ops/observability/grafana/dashboards/ instead, so a dashboard
    # somebody tuned survives a `docker compose down -v`.
    allowUiUpdates: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
