name: Deploy backend to EC2

# Replaces deploying by hand over SSH. Every push that touches the backend
# runs the checks first and only ships if they pass, so a broken build cannot
# reach the box that the tracker is streaming to.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  # Available for a manual redeploy without an empty commit.
  workflow_dispatch:

concurrency:
  # A second push while one deploy is mid-rsync would interleave file writes.
  group: deploy-backend
  cancel-in-progress: false

jobs:
  verify:
    name: Test and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Tests
        run: npx jest --runInBand

      # The repo carries a known set of pre-existing type errors, so this
      # fails only when a change adds more rather than on the backlog itself.
      - name: Typecheck (no new errors)
        run: |
          BASELINE=23
          COUNT=$(npx tsc --noEmit 2>&1 | grep -c "error TS" || true)
          echo "TypeScript errors: $COUNT (baseline $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::$COUNT type errors, above the baseline of $BASELINE"
            npx tsc --noEmit 2>&1 | grep "error TS" || true
            exit 1
          fi

  deploy:
    name: Ship to EC2
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Secrets arrive as env vars rather than being interpolated into the
      # script text: a multi-line PEM spliced into a shell command is fragile,
      # and the previous version swallowed stderr, so every misconfiguration
      # surfaced identically as "exit code 1" with nothing to act on.
      - name: Load the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.EC2_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
          DEPLOY_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          # Name the missing secret. GitHub masks values in logs, and none are
          # printed here regardless.
          MISSING=""
          [ -n "${DEPLOY_KEY:-}" ]  || MISSING="$MISSING EC2_SSH_KEY"
          [ -n "${DEPLOY_HOST:-}" ] || MISSING="$MISSING EC2_HOST"
          [ -n "${DEPLOY_USER:-}" ] || MISSING="$MISSING EC2_USER"
          if [ -n "$MISSING" ]; then
            echo "::error::missing repository secret(s):$MISSING — add them at Settings ▸ Secrets and variables ▸ Actions"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem

          # A key pasted without its final newline, or with the BEGIN/END lines
          # dropped, otherwise fails much later with an opaque "invalid format".
          if ! ssh-keygen -y -f ~/.ssh/deploy.pem > /dev/null 2>&1; then
            echo "::error::EC2_SSH_KEY is not a usable private key — likely truncated, or pasted without the -----BEGIN-----/-----END----- lines"
            exit 1
          fi
          echo "deploy key parsed successfully"

          # stderr is kept this time: a DNS or firewall problem should say so.
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          if ! [ -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan returned no host key for EC2_HOST — check the hostname and that port 22 is reachable"
            exit 1
          fi
          echo "host key recorded for the deploy target"

      # --exclude .env is not optional: the server holds the production
      # environment file and nothing in the repo should ever overwrite it.
      - name: Sync backend
        env:
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
          DEPLOY_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -az --delete \
            --exclude node_modules \
            --exclude .git \
            --exclude .env \
            --exclude dist \
            -e "ssh -i ~/.ssh/deploy.pem -o StrictHostKeyChecking=yes" \
            backend/ \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/$DEPLOY_USER/backend/"

      # Dependencies are installed only when the lockfile actually changed.
      # A plain `npm ci` on every deploy would be slow, and `--omit=dev` would
      # delete tsx, which is what the systemd unit executes.
      - name: Install dependencies if the lockfile changed
        env:
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
          DEPLOY_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy.pem "$DEPLOY_USER@$DEPLOY_HOST" '
            cd ~/backend
            if ! cmp -s package-lock.json .deployed-lock; then
              echo "Lockfile changed, installing"
              npm install --no-audit --no-fund
              cp package-lock.json .deployed-lock
            else
              echo "Lockfile unchanged, skipping install"
            fi
          '

      - name: Restart and verify
        env:
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
          DEPLOY_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy.pem "$DEPLOY_USER@$DEPLOY_HOST" '
            # The unit is `fuelsense`. Until 2026-08-21 a duplicate named
            # `fuelsense-backend` also existed, and this step restarted that
            # one -- so deploys shipped code to disk and left the running
            # process on the old version. Do not rename this back.
            sudo systemctl restart fuelsense
            for i in $(seq 1 20); do
              sleep 3
              CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/api/health || true)
              if [ "$CODE" = "200" ]; then
                echo "Healthy after $((i * 3))s"
                # A 200 only proves the API answers. Confirm the process
                # holding the ingest port is the one systemd just started,
                # otherwise something outside systemd is serving traffic.
                MAIN=$(systemctl show fuelsense -p MainPID --value)
                PORT=$(sudo ss -lptnH "sport = :5027" | grep -oP "pid=\K[0-9]+" | head -1)
                if [ "$MAIN" != "$PORT" ]; then
                  echo "::error::port 5027 held by PID $PORT, but systemd MainPID is $MAIN"
                  exit 1
                fi
                echo "Ingest port owned by systemd (PID $MAIN)"
                exit 0
              fi
            done
            echo "Service did not come back healthy"
            sudo journalctl -u fuelsense -n 40 --no-pager
            exit 1
          '

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/deploy.pem
