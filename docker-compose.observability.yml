# Local observability stack: Prometheus (metrics), Loki (logs), Grafana (both).
#
# Deliberately a separate file from docker-compose.yml. The main file is the
# app; this one is the instruments watching it, and you want to be able to bring
# the instruments up and down without restarting the thing being measured.
#
#   docker compose -f docker-compose.observability.yml up -d
#   open http://localhost:9091        # Grafana, anonymous admin
#
# Ports sit in the 909x range, clear of Next.js's 3000-upward auto-increment.
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: fuelsense-prometheus
    command:
      - --config.file=/etc/prometheus/conf/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      # Explicitly loopback. A bare '9090:9090' publishes on 0.0.0.0, which put
      # Prometheus — device IMEIs and all — on every network this laptop joins.
      - '127.0.0.1:9090:9090'
    volumes:
      # Directory, never individual files. A single-file bind mount pins an
      # inode: edit the file on the host and the container keeps reading the old
      # one, or — as happened here on 2026-08-24 — a truncated one, and
      # Prometheus rejects the reload with a parse error against content that
      # looks perfectly valid on disk. Mounting the directory makes edits
      # resolve normally.
      - ./ops/observability/prometheus:/etc/prometheus/conf:ro
      - prometheus_data:/prometheus
    extra_hosts:
      # Lets the container reach a backend running on the host with `npm run
      # dev`. Docker Desktop resolves this for free; Linux hosts need the
      # gateway mapping spelled out, which is what this line does.
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    container_name: fuelsense-loki
    command: -config.file=/etc/loki/conf/loki-config.yml
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./ops/observability/loki:/etc/loki/conf:ro
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.2
    container_name: fuelsense-promtail
    command: -config.file=/etc/promtail/conf/promtail-config.yml
    volumes:
      - ./ops/observability/promtail:/etc/promtail/conf:ro
      # Backend run on the host: `npm run dev:logs` writes here.
      - ./backend/logs:/var/log/fuelsense:ro
      # Backend run as a container: read its stdout through the daemon.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    container_name: fuelsense-grafana
    ports:
      # The loopback prefix is what makes the anonymous-admin setting below
      # defensible. Published as '3000' this was reachable from any network the
      # laptop joined, and anonymous admin on an open port is not a developer
      # convenience, it is an open door.
      #
      # 9091 rather than 3002: Next.js picks the first free port from 3000
      # upward, so with 3000 and 3001 taken the frontend lands on 3002 and
      # fights Grafana for it. Sitting next to Prometheus keeps it clear of
      # that range entirely.
      - '127.0.0.1:9091:3000'
    environment:
      # No login — safe only because the port above is loopback-only. A password
      # would buy nothing against an attacker who is already on this machine,
      # and costs a login every time you want to look at a graph.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      # Land on the FuelSense dashboard, not on Grafana's welcome page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fuelsense-backend.json
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  promtail_positions:
